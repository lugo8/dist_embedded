# Raft configuration (Lab 5 Part 2). Must be identical on every node:
# both STM32 builds and the Pi build generate common/raft_conf.h from this file.
# Change it, then rebuild the Pi and reflash both STM32s.

N = 3                           # cluster size; a majority is N/2 + 1
nodes = cockpit, front, rear    # node IDs 1, 2, 3 (N1 Pi, N2 steering, N3 drivetrain)

# cockpit | front | rear : boot in term 1 with that node as leader, no election
# random  : no pre-defined leader; once every node has been heard, elect, with the
#           election jitter drawn from a PRNG seeded by `seed` (tools/find_seed.py)
# none    : same as random
default_leader = random
seed = 48                       # 48: an STM32 (front) wins; 23: the Pi wins (tools/find_seed.py)

heartbeat_ms = 20               # REF period: Raft heartbeat and clock sync message
missed_heartbeats = 3           # follower timeout = missed_heartbeats * heartbeat_ms
election_timeout_jitter_ms = 39 #   + U(0, election_timeout_jitter_ms)
log_size = 30000                # events the log holds

Debug = yes                     # print election and append messages
