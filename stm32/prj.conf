CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_CAN=y
CONFIG_WATCHDOG=y
CONFIG_PRINTK=y

# MCP2515 driver thread runs above every app thread (app uses 3..8)
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2

# Lab 5: 64-bit cycle counter for the microsecond clock behind global time (84 MHz)
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
# Raft log (30 KB) and agent state live in .bss; console printouts go through printk
CONFIG_MAIN_STACK_SIZE=2048
